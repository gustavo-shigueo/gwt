[package]
name = "gwt-bin"
version = "0.5.0"
edition = "2024"
description = "CLI tool to facilitate the use of git worktrees"
license = "MIT OR Apache-2.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
enum_glob_use = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
ureachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_convertions = "deny"

[dependencies]
clap = { version = "4.5.53", features = ["derive"] }
clap_complete = { version = "4.6.9", features = ["unstable-dynamic"] }
clap_complete_nushell = "4.6.2"
color-eyre = "0.6.5"
serde = { version = "1.0.129", features = ["derive"] }
toml = "1.1.4"

[[bin]]
name = "gwt-bin"
path = "src/main.rs"

